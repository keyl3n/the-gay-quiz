name: build
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2.1.0 (leave empty to only build)
        required: false
        type: string
      prerelease:
        description: Mark the release as a pre-release
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            out: thegayquiz-linux-x64
          - os: macos-latest
            out: thegayquiz-macos-arm64
          - os: windows-latest
            out: thegayquiz-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm ci
      - run: pnpm test
      - run: pnpm run bundle
      - run: node -e "require('fs').writeFileSync('sea-config.json', JSON.stringify({main:'build/bundle.min.js',output:'${{ matrix.out }}',disableExperimentalSEAWarning:true,useCodeCache:true}))"
      - run: node --build-sea sea-config.json
      - if: runner.os == 'macOS'
        run: codesign --sign - ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build changelog from commits since last release
        run: |
          prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')

          # oldest first: sha, author (GitHub login, else commit author name), is-login flag, subject
          fmt='.[] | select((.parents | length) == 1) | [.sha[0:7], (.author.login // .commit.author.name), (.author.login != null), (.commit.message | split("\n")[0])] | join("\t")'
          if [ -n "$prev" ]; then
            echo "Previous release: $prev"
            commits=$(gh api --paginate "repos/$REPO/compare/$prev...${{ github.sha }}" --jq ".commits | $fmt")
            compare="**Full changelog:** ${{ github.server_url }}/$REPO/compare/$prev...$TAG"
          else
            echo "No previous release, listing all commits"
            commits=$(gh api --paginate "repos/$REPO/commits?sha=${{ github.sha }}" --jq "$fmt" | tac)
            compare=""
          fi

          # first-time contributors: authors in this release with no commits reachable from the previous release
          newcomers=""
          if [ -n "$prev" ]; then
            for login in $(echo "$commits" | awk -F'\t' '$3 == "true" && $2 !~ /\[bot\]$/ { print $2 }' | awk '!seen[$0]++'); do
              if [ "$(gh api "repos/$REPO/commits?sha=$prev&author=$login&per_page=1" --jq length)" = "0" ]; then
                newcomers="$newcomers- @$login"$'\n'
              fi
            done
          fi

          {
            echo "## Changes"
            echo
            echo "$commits" | while IFS=$'\t' read -r sha author is_login subject; do
              [ -z "$sha" ] && continue
              if [ "$is_login" = "true" ]; then by="@$author"; else by="$author"; fi
              echo "- $subject ($sha) by $by"
            done
            if [ -n "$newcomers" ]; then
              echo
              echo "## First-time contributors"
              echo
              printf '%s' "$newcomers"
            fi
            if [ -n "$compare" ]; then echo; echo "$compare"; fi
          } > notes.md

          cat notes.md

      - name: Create release
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            artifacts/*
